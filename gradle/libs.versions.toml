kotlin = "2.2.0"
composeBom = "2026.01.00"
activityCompose = "1.10.1"
navigation3 = "1.1.7"
lifecycleNavigation3 = "2.10.0"
okhttp = "4.12.0"
serialization = "1.9.0"
coil = "3.2.0"
browser = "1.9.0"
