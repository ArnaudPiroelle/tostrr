# Every push to main publishes the version set in app/build.gradle.kts (versionName) as a GitHub release, with
# the signed APK, once: when its tag vX.Y.Z already exists the version wasn't bumped and nothing is published.
# A versionName with a suffix (1.2.0-beta.1) is published as a pre-release. The signing key comes from the
# repository secrets TOSTRR_KEYSTORE_BASE64, TOSTRR_KEYSTORE_PASSWORD, TOSTRR_KEY_ALIAS and TOSTRR_KEY_PASSWORD; the
# Firebase config that turns Crashlytics on (and uploads the R8 mapping) from TOSTRR_GOOGLE_SERVICES_JSON, if set.
# The release is created as a draft: the installed apps offer it, with its notes, as soon as it is published by hand.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -nE 's/.*versionName = .*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          if [[ -z "$name" ]]; then
            echo "::error::No versionName found in app/build.gradle.kts"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$name" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" > /dev/null 2>&1; then
            echo "::warning::Release v$name already exists: bump versionName in app/build.gradle.kts to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.publish == 'true'

      - name: Unit tests
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest

      - name: Signed APK
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TOSTRR_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.TOSTRR_GOOGLE_SERVICES_JSON }}
          ORG_GRADLE_PROJECT_tostrrStorePassword: ${{ secrets.TOSTRR_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_tostrrKeyAlias: ${{ secrets.TOSTRR_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_tostrrKeyPassword: ${{ secrets.TOSTRR_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::No TOSTRR_GOOGLE_SERVICES_JSON secret: this release has Crashlytics turned off."
          fi
          # The run number only grows, as Android requires for an update to install.
          ./gradlew :app:assembleRelease \
            -PtostrrStoreFile="$keystore" \
            -PtostrrVersionCode="${{ github.run_number }}"
          rm "$keystore"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "tostrr-${{ steps.version.outputs.name }}.apk"

      - name: GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --target "$GITHUB_SHA" --title "Tostrr ${{ steps.version.outputs.name }}" --generate-notes)
          if [[ "${{ steps.version.outputs.prerelease }}" == true ]]; then flags+=(--prerelease); fi
          gh release create "${{ steps.version.outputs.tag }}" "tostrr-${{ steps.version.outputs.name }}.apk" "${flags[@]}"
